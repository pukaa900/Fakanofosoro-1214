plugins {
    id 'fabric-loom' version "1.1-SNAPSHOT"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already sets up MC + Fabric repositories
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "modid" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // --- Minecraft 1.20.4 ---
    minecraft "com.mojang:minecraft:1.20.4"

    // --- Yarn mappings for 1.20.4 ---
    mappings "net.fabricmc:yarn:1.20.4+build.3:v2"

    // --- Fabric Loader compatible with 1.20.4 ---
    modImplementation "net.fabricmc:fabric-loader:0.15.6"

    // --- Fabric API for 1.20.4 ---
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.95.1+1.20.4"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.20.4 uses Java 17
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
